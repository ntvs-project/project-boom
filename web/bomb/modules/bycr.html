<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複雜密碼 - Project BOOM</title>
    <script src="/bomb/lib/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="/bomb/lib/components.css">
    <link rel="stylesheet" href="/bomb/style/style.css">
    <link rel="stylesheet" href="/bomb/style/bycr.css">
</head>
<body>
    <div id="back">
        <a href="/bomb/index.html">&lt;</a>
    </div>
    <div id="manual" popover>
        <iframe
            src="/../manual.pdf#toolbar=0&navpanes=0&scrollbar=0&view=Fit&page=6"
            title="Manual"
            loading="lazy"
            allowfullscreen
        ></iframe>
    </div>
    <div id="float">
        <button popovertarget="manual" popovertargetaction="open">📘</button>
    </div>

    <h1>複雜密碼</h1>
    <div id="YB">
        <led id="ledY" colour="yellow"></led>
        <led id="ledB" colour="blue"></led>
    </div>
	<main>
        <div class="col">
            <div class="row">
                <led id="led0" colour="cyan" state="0"></led>
                <led id="led1" colour="cyan" state="0"></led>
                <led id="led2" colour="cyan" state="0"></led>
                <led id="led3" colour="cyan" state="0"></led>
            </div>
            <btn id="start">start</btn>
            <btn id="btn"></btn>
        </div>
    </main>

	<script src="/bomb/lib/components.js"></script>
    <script src="/bomb/script/bycr.js"></script>

</html>
