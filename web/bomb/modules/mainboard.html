<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主板 - Project BOOM</title>
    <script src="/bomb/lib/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="/bomb/lib/components.css">
    <link rel="stylesheet" href="/bomb/style/style.css">
    <link rel="stylesheet" href="/bomb/style/mainboard.css">

    <script src="/bomb/lib/moment.js"></script>
</head>
<body>
    <div id="back">
        <a href="/bomb/index.html">&lt;</a>
    </div>
    <div id="manual" popover>
        <iframe
            src="/../manual.pdf#toolbar=0&navpanes=0&scrollbar=0&view=Fit&page=4"
            title="Manual"
            loading="lazy"
            allowfullscreen
        ></iframe>
    </div>
    <div id="float">
        <button popovertarget="manual" popovertargetaction="open">📘</button>
    </div>

    <h1>主板</h1>
	<main>
        <div>
            <seg7quad num="0000"></seg7quad>
            <div id="YB">
                <led id="ledY" state="0" colour="yellow"></led>
                <led id="ledB" state="0" colour="blue"></led>
            </div>
        </div>
        <div>
            <div id="miss">
                <led id="ledM1" colour="red" state="0"></led>
                <led id="ledM2" colour="red" state="0"></led>
                <led id="ledM3" colour="red" state="0"></led>
            </div>
        </div>
        <div>
            <btn id="btn-reset">Reset</btn>
            <btn id="btn-start">Start</btn>
        </div>
    </main>

	<script src="/bomb/lib/components.js"></script>
    <script src="/bomb/script/mainboard.js"></script>
</body>
</html>
