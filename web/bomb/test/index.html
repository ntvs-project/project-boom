<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Test</title>
    <script src="/bomb/lib/jquery-4.0.0.min.js"></script>
	<link rel="stylesheet" href="/bomb/style/style.css">
	<link rel="stylesheet" href="/bomb/lib/components.css">
</head>
<body>
	<h1>Test</h1>

	<div>
		<h3>LED</h3>
		<led id="led1" colour="magenta" state="1"></led>
		<led id="led2" colour="red"  state="0"></led>
		
		<h3>7 Segment Display</h3>
		<seg7 id="7seg1">1111110_0</seg7>
		<seg7 id="7seg2" num="3."></seg7>
		<seg7 id="7seg3" num="1"></seg7>
		<seg7 id="7seg4">1011111_0</seg7>

		<h3>Button</h3>
		<btn id="btn1"></btn>
		<btn id="btn2"></btn>

		<h3>Matrix</h3>
		<matrix col="4" row="4" gap="10">
			<btn value="1">1</btn>
			<btn value="2">2</btn>
			<btn value="3">3</btn>
			<btn value="A">A</btn>

			<btn value="4">4</btn>
			<btn value="5">5</btn>
			<btn value="6">6</btn>
			<btn value="B">B</btn>

			<btn value="7">7</btn>
			<btn value="8">8</btn>
			<btn value="9">9</btn>
			<btn value="C">C</btn>

			<btn value="asterisk">*</btn>
			<btn value="0">0</btn>
			<btn value="hash">#</btn>
			<btn value="D">D</btn>
		</matrix>

		<h3>Buzzer</h3>
		<btn id="btn3">grey</btn>
		<btn id="btn4">caesar</btn>
	</div>

	<script src="/bomb/lib/components.js"></script>
    <script src="/bomb/test/test.js"></script>
</body>
</html>
