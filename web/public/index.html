<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project BOOM - 拆彈手冊實境模擬</title>
<link rel="stylesheet" href="css/style.css?v=20261126e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="ktane-theme">

<!-- 頂部警示斜紋飾條 -->
<div class="hazard-stripe-bar top"></div>

<!-- ================= 炸彈主畫面 (使用 main.pdf 原始遊戲主圖，開局直接玩) ================= -->
<section id="gameScreen" class="screen">

  <!-- 頂部簡報導航列 -->
  <header class="bomb-top-bar">
    <div class="bomb-badge">
      <span class="status-indicator live"></span>
      <span class="bomb-id">ORDNANCE: PROJECT BOOM (115學年度)</span>
    </div>
    <div class="bomb-top-controls">
      <button class="tool-btn" id="openManualBtn">📖 拆彈手冊 (MANUAL)</button>
      <button class="tool-btn danger" id="resetRoundBtn">🔄 重新開始本局</button>
    </div>
  </header>

  <!-- 提示文字 -->
  <div class="bomb-interaction-tip">
    🔍 點擊炸彈上的任一模組即可<strong>放大到畫面中間</strong>開始拆解！右上角將隨時顯示剩餘時間與黃藍指示燈。
  </div>

  <!-- 炸彈手提機殼主圖容器（尺寸完美符合 main.pdf 的 bomb.png: 1149 x 769） -->
  <div class="bomb-chassis-wrapper">
    <div class="bomb-board" id="bombBoard">
      <!-- 原始手冊底圖 -->
      <img src="images/bomb.png" alt="Bomb Chassis" class="bomb-bg-img" id="bombBgImg">

      <!-- ============ 6 大熱區與即時燈號疊加層 ============ -->

      <!-- 1. 左上：四色按鈕 (Four-Color) -->
      <div class="module-bay-hotspot" id="hotspot-fourColor" data-module="fourColor" title="點擊放大：四色按鈕">
        <div class="bay-status-led" id="led-status-fourColor"></div>
        <div class="hover-inspect-badge">🔍 點擊操作</div>
      </div>

      <!-- 2. 中上：主板 (Mainboard - 計時器 / 失誤燈 / YB指示燈) -->
      <div class="module-bay-hotspot mainboard-hotspot" id="hotspot-mainboard" title="炸彈主板核心">
        <!-- 數位 7 段計時器疊加顯示 (精準對齊圖片顯示螢幕) -->
        <div class="main-timer-overlay" id="mainboardTimer">05:00</div>
        <!-- 3 個紅色失誤指示燈疊加 (精準對齊圖片 3 個紅燈) -->
        <span class="mb-strike-dot strike-1" id="mbStrike1"></span>
        <span class="mb-strike-dot strike-2" id="mbStrike2"></span>
        <span class="mb-strike-dot strike-3" id="mbStrike3"></span>
        <!-- 黃藍特殊指示燈疊加 (精準對齊圖片右側黃藍燈) -->
        <span class="mb-yb-dot yb-yellow" id="mbYbY"></span>
        <span class="mb-yb-dot yb-blue" id="mbYbB"></span>
      </div>

      <!-- 3. 右上：格雷 / 凱撒密碼 (Grey / Caesar) -->
      <div class="module-bay-hotspot" id="hotspot-greyCaesar" data-module="greyCaesar" title="點擊放大：格雷/凱撒密碼">
        <div class="bay-status-led" id="led-status-greyCaesar"></div>
        <div class="hover-inspect-badge">🔍 點擊操作</div>
      </div>

      <!-- 4. 左下：三角翻譯 (Trislator) -->
      <div class="module-bay-hotspot" id="hotspot-trislator" data-module="trislator" title="點擊放大：三角翻譯">
        <div class="bay-status-led" id="led-status-trislator"></div>
        <div class="hover-inspect-badge">🔍 點擊操作</div>
      </div>

      <!-- 5. 中下：頻率調變 (Resonance / Tune) -->
      <div class="module-bay-hotspot" id="hotspot-tune" data-module="tune" title="點擊放大：頻率調變">
        <div class="bay-status-led" id="led-status-tune"></div>
        <div class="hover-inspect-badge">🔍 點擊操作</div>
      </div>

      <!-- 6. 右下：資料排序 (Sorting / Tros) -->
      <div class="module-bay-hotspot" id="hotspot-sort" data-module="sort" title="點擊放大：資料排序">
        <div class="bay-status-led" id="led-status-sort"></div>
        <div class="hover-inspect-badge">🔍 點擊操作</div>
      </div>
    </div>
  </div>
</section>

<!-- ================= 放大後的模組居中操作視窗 (ZOOMED FOCUS VIEW) ================= -->
<div id="moduleFocusOverlay" class="focus-overlay hidden">

  <!-- 右上角常駐 HUD（計時器、失誤次數、黃藍指示燈狀態） -->
  <aside class="focus-top-hud">
    <div class="hud-box">
      <!-- 倒數計時器 -->
      <div class="hud-section hud-timer-section">
        <div class="hud-title">REMAINING</div>
        <div class="hud-timer-display" id="hudTimerDisplay">05:00</div>
      </div>

      <!-- 失誤次數 (STRIKES) -->
      <div class="hud-section hud-strikes-section">
        <div class="hud-title">STRIKES</div>
        <div class="hud-strikes-holder" id="hudStrikesHolder">
          <span class="hud-strike-x" data-n="1">✕</span>
          <span class="hud-strike-x" data-n="2">✕</span>
          <span class="hud-strike-x" data-n="3">✕</span>
        </div>
      </div>

      <!-- 黃藍特殊指示燈 (INDICATORS) -->
      <div class="hud-section hud-yb-section">
        <div class="hud-title">INDICATORS</div>
        <div class="hud-yb-lamps">
          <div class="hud-lamp-group">
            <span class="hud-lamp-led yellow" id="hudYbY"></span>
            <span class="hud-lamp-name">Y</span>
          </div>
          <div class="hud-lamp-group">
            <span class="hud-lamp-led blue" id="hudYbB"></span>
            <span class="hud-lamp-name">B</span>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 放大畫面左上方：返回全貌按鈕 -->
  <div class="focus-back-bar">
    <button class="focus-back-btn" id="zoomOutBtn">
      <span class="back-arrow">←</span> 返回炸彈全貌 (ESC)
    </button>
  </div>

  <!-- 畫面中央：放大的模組本體操作機箱 -->
  <div class="focus-center-console">
    <div class="focus-console-header">
      <span class="console-status-led" id="focusModuleStatusLed"></span>
      <h2 class="console-title" id="focusModuleTitle">模組操作</h2>
    </div>

    <!-- 各模組的動態互動內容容器 -->
    <div class="focus-console-body" id="focusModuleContent">
      <!-- 點擊不同模組時在此動態渲染 -->
    </div>
  </div>
</div>

<!-- ================= 拆彈手冊彈出視窗 ================= -->
<div id="manualModal" class="manual-modal hidden">
  <div class="manual-backdrop" id="manualBackdrop"></div>
  <div class="manual-window">
    <div class="manual-header">
      <div class="binder-rings">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      </div>
      <h2>PROJECT BOOM 拆彈操作手冊 (手冊第 1~12 頁精華)</h2>
      <button class="manual-close-btn" id="manualCloseBtn">✕ 關閉手冊</button>
    </div>
    <div class="manual-body" id="manualBody">
      <!-- 由 reference-table.js 與 app.js 動態渲染 -->
    </div>
  </div>
</div>

<!-- ================= 結算視窗 (勝利 / 爆炸) ================= -->
<div id="resultModal" class="result-modal hidden">
  <div class="result-backdrop"></div>
  <div class="result-card" id="resultCard">
    <div class="result-icon" id="resultIcon">💥</div>
    <h2 class="result-title" id="resultTitle">孩子，你炸了！</h2>
    <p class="result-desc" id="resultDesc">失誤累積達 3 次，炸彈已被引爆。</p>
    <div class="result-stats" id="resultStats"></div>
    <div class="result-actions">
      <button class="ktane-btn primary-btn" id="restartGameBtn">🔄 重新開始拆彈 (5分鐘挑戰)</button>
    </div>
  </div>
</div>

<!-- 腳本引入 -->
<script src="js/sound-fx.js?v=20261126f"></script>
<script src="js/reference-table.js?v=20261126f"></script>
<script src="js/app.js?v=20261126f"></script>
</body>
</html>
